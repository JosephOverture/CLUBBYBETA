packages:
  - packages/*
  - apps/mobile

allowBuilds:
  esbuild: true
  '@nestjs/core': false
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/darwin-arm64': true

minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.0'
  - '@nestjs/core@12.1.0'
  - '@nestjs/platform-fastify@12.1.0'
  - '@aws-sdk/checksums@3.1001.1'
  - '@aws-sdk/client-s3@3.1138.0'
  - '@aws-sdk/core@3.978.1'
  - '@aws-sdk/credential-provider-env@3.972.72'
  - '@aws-sdk/credential-provider-http@3.972.74'
  - '@aws-sdk/credential-provider-ini@3.973.17'
  - '@aws-sdk/credential-provider-login@3.972.79'
  - '@aws-sdk/credential-provider-node@3.972.84'
  - '@aws-sdk/credential-provider-process@3.972.72'
  - '@aws-sdk/credential-provider-sso@3.973.16'
  - '@aws-sdk/credential-provider-web-identity@3.972.78'
  - '@aws-sdk/middleware-sdk-s3@3.972.77'
  - '@aws-sdk/nested-clients@3.997.46'
  - '@aws-sdk/signature-v4-multi-region@3.996.47'
  - '@aws-sdk/token-providers@3.1138.0'
  - '@aws-sdk/types@3.974.6'
  - '@aws-sdk/xml-builder@3.972.41'
  - react-native-qrcode-svg@6.3.26
  - prettier@3.9.9

# Keep OneDrive-backed workspace source separate from the dependency store.
packageImportMethod: copy

# xcode uses the compatible CommonJS v4() API; 11.1.1 fixes GHSA-w5hq-g745-h8pq.
overrides:
  # Patched Windows served-directory containment (GHSA-g7r4-m6w7-qqqr).
  esbuild: 0.28.1
  'xcode>uuid': 11.1.1
  # Compatible patch fixes both Joi prototype-pollution advisories in the pass generator.
  'passkit-generator>joi': 17.13.6
