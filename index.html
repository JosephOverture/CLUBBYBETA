<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nocturne Milano</title>
<meta name="description" content="A premium mobile nightlife discovery and booking platform for Milan — map-led venue discovery, tickets with QR, and 3D table reservations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<script src="qrcode.js"></script>
<script src="milanmap.js"></script>
<script>/* apply saved theme before first paint to avoid a flash */try{if(localStorage.getItem('nocturne-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<style>
:root{
  color-scheme:dark;
  --bg:#08080B; --bg2:#0D0D12; --surface:#15151D; --surface2:#1D1D28; --surface3:#26263380;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.13);
  --text:#F6F5FA; --muted:#9D9BAD; --muted2:#6E6C7E;
  --violet:#8B5CF6; --violet-2:#A855F7; --magenta:#D946EF; --indigo:#6366F1;
  --green:#35D6A0; --red:#FB5B78; --amber:#F6B44C; --blue:#5AA8FF;
  --grad:linear-gradient(135deg,#8B5CF6 0%,#D946EF 100%);
  --grad-soft:linear-gradient(135deg,rgba(139,92,246,.22),rgba(217,70,239,.14));
  --glow:0 0 32px rgba(139,92,246,.45);
  --radius:20px; --radius-sm:13px; --radius-xs:9px;
  --ease:cubic-bezier(.22,1,.36,1); --ease-in:cubic-bezier(.5,0,.75,0);
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  --shadow:0 18px 50px -12px rgba(0,0,0,.7);
  /* structural (theme-aware) tokens */
  --page-bg:#050507;
  --page-grad:radial-gradient(1200px 800px at 30% -10%,#161327 0%,#08070c 45%,#050506 100%);
  --topbar-grad:linear-gradient(#08080b 55%,transparent);
  --tabbar-grad:linear-gradient(transparent,rgba(8,8,11,.85) 30%,#08080b);
  --ovback-grad:linear-gradient(#08080b,transparent);
  --map-title:rgba(255,255,255,.045);
  --map-label:#ffffff; --map-label-sh:0 2px 8px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9);
  --nil1:#0e0d16; --nil2:#100f19; --nil3:#131120; --nil-stroke:rgba(139,92,246,.16);
  --cityline:rgba(168,85,247,.55); --map-rect:transparent;
  --skel1:#17171f; --skel2:#22222e;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F4F2EC; --bg2:#ECEAE2; --surface:#FFFFFF; --surface2:#F6F4EE; --surface3:#1712260a;
  --line:rgba(23,21,35,.10); --line2:rgba(23,21,35,.17);
  --text:#191722; --muted:#5F5D6E; --muted2:#928FA0;
  --violet:#7C4DD6; --violet-2:#8B45D6; --magenta:#C13BD6; --indigo:#6366F1;
  --green:#12A97A; --red:#E5476A; --amber:#D9902A; --blue:#3A86E0;
  --grad:linear-gradient(135deg,#8B5CF6 0%,#D946EF 100%);
  --grad-soft:linear-gradient(135deg,rgba(139,92,246,.14),rgba(217,70,239,.09));
  --glow:0 0 28px rgba(139,92,246,.30);
  --shadow:0 16px 42px -18px rgba(40,28,70,.30);
  --page-bg:#F4F2EC;
  --page-grad:radial-gradient(1200px 800px at 30% -10%,#EFEAF9 0%,#F4F2EC 46%,#F1EFE8 100%);
  --topbar-grad:linear-gradient(#F4F2EC 55%,transparent);
  --tabbar-grad:linear-gradient(transparent,rgba(244,242,236,.85) 30%,#F4F2EC);
  --ovback-grad:linear-gradient(rgba(244,242,236,.9),transparent);
  --map-title:rgba(30,22,60,.05);
  --map-label:#20202b; --map-label-sh:0 1px 2px rgba(255,255,255,.95),0 0 6px rgba(255,255,255,.8);
  --nil1:#FDFCFF; --nil2:#F6F3FE; --nil3:#EFEBFB; --nil-stroke:rgba(124,77,214,.22);
  --cityline:rgba(124,77,214,.55); --map-rect:#E8E4F2;
  --skel1:#ECEAE3; --skel2:#F5F3EE;
}
/* smooth colour crossfade only while switching theme */
body.theming, body.theming *{transition:background-color .32s var(--ease),color .28s var(--ease),border-color .32s var(--ease),fill .32s var(--ease),stroke .32s var(--ease),box-shadow .32s var(--ease)!important}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--text);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  background:var(--page-bg);background:var(--page-grad);
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
.hidden{display:none!important}

/* ---------- phone frame ---------- */
#phone{
  position:relative;width:100%;max-width:428px;height:100dvh;max-height:928px;
  background:var(--bg);overflow:hidden;
  box-shadow:0 40px 120px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.04);
}
@media(min-width:460px){#phone{border-radius:44px;height:92dvh}}
#app{position:absolute;inset:0;overflow:hidden}

/* ---------- top search ---------- */
.topbar{position:absolute;top:0;left:0;right:0;z-index:40;padding:14px 14px 10px;
  background:var(--topbar-grad);pointer-events:none}
.topbar>*{pointer-events:auto}
.searchrow{display:flex;gap:9px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;height:46px;padding:0 15px;
  background:var(--surface);border:1px solid var(--line);border-radius:15px;
  box-shadow:0 6px 22px -10px rgba(0,0,0,.7)}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14.5px}
.search input::placeholder{color:var(--muted2)}
.iconbtn{width:46px;height:46px;flex:none;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--text)}
.iconbtn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;margin-top:11px;overflow-x:auto;padding-bottom:3px;scroll-behavior:smooth}
.chip{flex:none;height:34px;padding:0 15px;border-radius:999px;font-size:13px;font-weight:500;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);
  display:flex;align-items:center;gap:7px;transition:.25s var(--ease);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px -6px rgba(168,85,247,.7)}
.chip.on .dot{background:#fff;box-shadow:none}

/* ---------- MAP ---------- */
#mapscreen{position:absolute;inset:0;overflow:hidden}
#world{position:absolute;top:0;left:0;transform-origin:center center;will-change:transform}
#mapsvg{position:absolute;width:100%;height:100%;display:block}
:root[data-theme="light"] .mbg{fill:var(--map-rect)}
.nil{fill:var(--nil2);stroke:var(--nil-stroke);stroke-width:.7;vector-effect:non-scaling-stroke}
.nil:nth-child(3n){fill:var(--nil3)}
.nil:nth-child(3n+1){fill:var(--nil1)}
.cityline{fill:none;stroke:var(--cityline);stroke-width:1.8;stroke-linejoin:round}
.mroad{fill:none;stroke:rgba(255,255,255,.05);stroke-width:.6}
#markers{position:absolute;inset:0}
.marker{position:absolute;transform:translate(-50%,-100%);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;transition:transform .3s var(--ease);
  animation:markerIn .5s var(--ease) backwards}
@keyframes markerIn{from{opacity:0;transform:translate(-50%,-70%) scale(.6)}}
.marker .pin{width:52px;height:52px;border-radius:16px;position:relative;
  border:2px solid rgba(255,255,255,.85);overflow:hidden;
  box-shadow:0 8px 22px -6px rgba(0,0,0,.8);transition:.3s var(--ease)}
.marker .pin::after{content:"";position:absolute;inset:0;background:var(--vibe)}
.marker .pin .ic{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-size:22px}
.marker .tail{width:2px;height:9px;background:rgba(255,255,255,.7);margin-top:-1px}
.marker .lbl{margin-top:5px;font-size:12px;font-weight:600;color:var(--map-label);
  text-shadow:var(--map-label-sh);white-space:nowrap;
  font-family:var(--serif);letter-spacing:.2px}
.marker.sel{z-index:10}
.marker.sel .pin{transform:scale(1.18);border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,92,246,.35),var(--glow)}
.marker .live{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;
  background:var(--green);border:2px solid #08080b;z-index:3}
.marker .live.soon{background:var(--amber)}
.marker .live.off{background:var(--muted2)}
.maptitle{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  font-family:var(--serif);font-size:64px;font-weight:600;letter-spacing:2px;
  color:var(--map-title);pointer-events:none;user-select:none}
.geo{position:absolute;right:14px;bottom:104px;z-index:35}
.attrib{position:absolute;right:8px;bottom:92px;font-size:9px;color:var(--muted2);z-index:35;opacity:.7}

/* ---------- bottom sheet (venue preview) ---------- */
.sheet{position:absolute;left:0;right:0;bottom:78px;z-index:45;
  transform:translateY(140%);transition:transform .5s var(--ease);will-change:transform}
.sheet.show{transform:translateY(0)}
.sheet-card{margin:0 10px;background:linear-gradient(180deg,var(--surface2),var(--surface));
  border:1px solid var(--line2);border-radius:24px;padding:16px 16px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sheet-card .beam{position:absolute;inset:0;background:var(--vibe);opacity:.14;pointer-events:none}
.grabber{width:40px;height:4px;border-radius:999px;background:var(--line2);margin:-4px auto 10px;position:relative}
.sheet-btns{display:flex;gap:8px;flex:none}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.vname{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.05;display:flex;align-items:center;gap:7px}
.vname .spark{color:var(--violet-2);font-size:18px}
.vtype{font-size:11px;letter-spacing:1.5px;color:var(--muted);margin-top:5px;font-weight:600}
.save{width:40px;height:40px;border-radius:12px;background:var(--surface3);border:1px solid var(--line);
  display:grid;place-items:center;flex:none}
.save svg{width:18px;height:18px}.save.on svg{fill:var(--violet-2);color:var(--violet-2)}
.statusrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;position:relative}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--text);
  background:var(--surface3);padding:6px 11px;border-radius:999px;border:1px solid var(--line)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.status.soon .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.status.off .dot{background:var(--muted2);box-shadow:none}
.avstack{display:flex}
.avstack .av{width:26px;height:26px;border-radius:50%;background:var(--grad);border:2px solid var(--surface);
  margin-left:-8px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.avstack .av:first-child{margin-left:0}
.vdesc{font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:12px;position:relative}
.tags{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;position:relative}
.tag{font-size:11.5px;color:var(--muted);background:var(--surface3);border:1px solid var(--line);
  padding:5px 10px;border-radius:8px}
.sheet-actions{display:flex;gap:9px;margin-top:15px;position:relative}
.btn{flex:1;height:48px;border-radius:14px;font-size:14.5px;font-weight:600;display:flex;
  align-items:center;justify-content:center;gap:8px;transition:.2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 10px 26px -8px rgba(168,85,247,.65)}
.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--line2)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.wide{width:100%;flex:none}
.btn svg{width:17px;height:17px}
.btn.evt{position:relative}
.btn .ecount{background:rgba(255,255,255,.22);border-radius:999px;padding:1px 8px;font-size:12px}

/* ---------- overlay (full views) ---------- */
.overlay{position:absolute;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  transform:translateX(100%);transition:transform .42s var(--ease);will-change:transform}
.overlay.show{transform:translateX(0)}
.overlay.modal{transform:translateY(100%)}
.overlay.modal.show{transform:translateY(0)}
.ovback{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--ovback-grad);pointer-events:none}
.ovback>*{pointer-events:auto}
.roundbtn{width:42px;height:42px;border-radius:50%;background:rgba(10,10,14,.6);backdrop-filter:blur(12px);
  border:1px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.roundbtn svg{width:19px;height:19px}
.ovtitle{font-size:15px;font-weight:600}

/* venue hero */
.hero{position:relative;height:340px;margin-top:-70px;overflow:hidden}
.hero .img{position:absolute;inset:0;background:var(--vibe)}
.hero .grain{position:absolute;inset:0;opacity:.5;
  background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.14),transparent 60%)}
.hero .beam{position:absolute;top:-30%;left:50%;width:60%;height:130%;transform:translateX(-50%) rotate(8deg);
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 70%);filter:blur(18px);opacity:.5}
.hero .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,11,.35) 0%,transparent 30%,rgba(8,8,11,.6) 78%,var(--bg) 100%)}
.hero .dots{position:absolute;bottom:118px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.hero .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
.hero .dots i.on{background:#fff;width:18px;border-radius:3px}
.hero-info{position:absolute;bottom:0;left:0;right:0;padding:0 18px 20px;z-index:3}
.hero-info .vname{font-size:36px}
.hero-info .loc{color:var(--muted);font-size:13.5px;margin-top:6px;display:flex;align-items:center;gap:6px}
.vbody{padding:4px 18px 130px}
.metarow{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.section-h{font-family:var(--serif);font-size:20px;font-weight:600;margin:26px 0 13px}
.evcard{display:flex;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:11px;margin-bottom:11px;transition:.2s var(--ease)}
.evcard:active{transform:scale(.985);background:var(--surface2)}
.evthumb{width:76px;height:76px;border-radius:12px;flex:none;background:var(--evibe);position:relative;overflow:hidden}
.evthumb .d{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
  border-radius:8px;padding:3px 6px;text-align:center;line-height:1}
.evthumb .d b{display:block;font-size:15px;font-weight:700}.evthumb .d s{font-size:8px;text-decoration:none;color:var(--muted);text-transform:uppercase}
.evmeta{flex:1;min-width:0}
.evmeta h4{font-size:15px;font-weight:600;margin-bottom:3px}
.evmeta .art{font-size:12.5px;color:var(--violet-2);font-weight:500}
.evmeta .sub{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap}
.evmeta .price{margin-top:7px;font-size:13px;font-weight:600}
.evmeta .price s{color:var(--muted);font-weight:400;font-size:11.5px;text-decoration:none}
.availbar{display:flex;gap:10px;margin-top:8px}
.availpill{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.availpill .t{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.availpill .v{font-size:15px;font-weight:600;margin-top:4px}
.mini-map{height:130px;border-radius:16px;overflow:hidden;position:relative;border:1px solid var(--line);margin-top:6px}

/* ---------- ticket flow ---------- */
.flowbody{padding:8px 18px 150px}
.step-h{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;margin:6px 0 6px}
.step-sub{color:var(--muted);font-size:13.5px;margin-bottom:20px}
.tier{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:15px;margin-bottom:11px;
  display:flex;justify-content:space-between;align-items:center;transition:.2s var(--ease);gap:12px}
.tier.on{border-color:var(--violet);background:linear-gradient(var(--surface2),var(--surface));box-shadow:0 0 0 1px var(--violet),0 8px 24px -10px rgba(139,92,246,.5)}
.tier h4{font-size:15.5px;font-weight:600}.tier .d{font-size:12px;color:var(--muted);margin-top:4px}
.tier .left{font-size:11px;color:var(--amber);margin-top:6px}
.tier .r{text-align:right;flex:none}
.tier .r b{font-size:17px;font-weight:700}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none;transition:.2s}
.tier.on .radio{border-color:var(--violet);background:radial-gradient(circle at center,var(--violet) 42%,transparent 46%)}
.stepper{display:flex;align-items:center;gap:0;background:var(--surface2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:42px;height:42px;font-size:22px;font-weight:400;color:var(--text);display:grid;place-items:center}
.stepper button:disabled{color:var(--muted2)}
.stepper .n{width:44px;text-align:center;font-size:16px;font-weight:600}
.rowline{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.rowline .lt h4{font-size:15px;font-weight:600}.rowline .lt p{font-size:12.5px;color:var(--muted);margin-top:3px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:500}
.field input,.field select{width:100%;height:50px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:0 15px;color:var(--text);font-size:15px;outline:none;transition:.2s}
.field input:focus,.field select:focus{border-color:var(--violet)}
.field.row2{display:flex;gap:11px}.field.row2>div{flex:1}
.cardface{background:linear-gradient(135deg,#1c1830,#241d3a);border:1px solid var(--line2);border-radius:16px;padding:16px;margin-bottom:13px}
.cardface .brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin:8px 0 18px}
.summary .l{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--muted)}
.summary .l.tot{color:var(--text);font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.footer-cta{position:absolute;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 26%);z-index:5}
.footer-cta .totline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.footer-cta .totline s{color:var(--muted);font-size:12px;text-decoration:none}
.footer-cta .totline b{font-size:22px;font-family:var(--serif);font-weight:600}

/* success + QR */
.success{padding:30px 22px 40px;text-align:center;min-height:100%;display:flex;flex-direction:column;align-items:center}
.checkwrap{width:88px;height:88px;border-radius:50%;background:var(--grad);display:grid;place-items:center;
  margin:20px 0 8px;box-shadow:var(--glow);animation:pop .6s var(--ease)}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.checkwrap svg{width:44px;height:44px;color:#fff}
.qrcard{background:#fff;border-radius:22px;padding:20px;margin:22px auto 0;width:100%;max-width:290px;
  box-shadow:0 20px 50px -12px rgba(139,92,246,.4);animation:qrReveal .7s var(--ease) .2s backwards}
@keyframes qrReveal{from{opacity:0;transform:scale(.85) translateY(10px);filter:blur(8px)}}
.qrcard .qr{width:100%;aspect-ratio:1;display:grid;place-items:center}
.qrcard .qr svg,.qrcard .qr img{width:100%;height:100%}
.qrcard .qmeta{color:#0a0a0a;text-align:center;margin-top:14px;border-top:1px dashed #ccc;padding-top:13px}
.qrcard .qmeta .ev{font-family:var(--serif);font-size:17px;font-weight:600}
.qrcard .qmeta .dt{font-size:12px;color:#666;margin-top:3px}
.qrcard .qmeta .tier{display:inline-block;margin-top:8px;background:#111;color:#fff;font-size:11px;font-weight:600;
  padding:4px 11px;border-radius:999px;border:none}
.qrcard .qmeta .drinks{font-size:11.5px;color:#8B5CF6;font-weight:600;margin-top:8px}
.wallets{display:flex;gap:10px;margin:20px 0 0;width:100%;max-width:290px}
.wallet{flex:1;height:46px;border-radius:12px;background:#000;border:1px solid #333;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:600}
.wallet.g{background:#fff;color:#000}

/* ---------- 3D TABLE ---------- */
.floorwrap{height:52vh;position:relative;overflow:hidden;background:
  radial-gradient(80% 60% at 50% 34%,#1c1636,#0a0a0e 78%);perspective:1000px;touch-action:none}
.scene{position:absolute;top:48%;left:50%;width:360px;height:330px;
  transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(54deg) rotateZ(0deg);
  transition:transform .08s linear}
.floorplane{position:absolute;inset:0;transform-style:preserve-3d;border-radius:10px;
  background:
    linear-gradient(rgba(139,92,246,.09) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(90deg,rgba(139,92,246,.09) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(135deg,#26203c,#191428);
  border:2px solid rgba(139,92,246,.55);
  box-shadow:0 0 80px rgba(139,92,246,.3),0 34px 60px rgba(0,0,0,.7),0 0 40px rgba(139,92,246,.15) inset}
.zone{position:absolute;border-radius:7px;display:grid;place-items:center;
  font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.72);font-weight:700;text-transform:uppercase}
.zone.dance{background:repeating-linear-gradient(45deg,rgba(139,92,246,.16),rgba(139,92,246,.16) 9px,rgba(139,92,246,.26) 9px,rgba(139,92,246,.26) 18px);border:1.5px solid rgba(139,92,246,.5)}
.zone.dj{background:var(--grad);color:#fff;box-shadow:0 0 28px rgba(217,70,239,.7);transform:translateZ(14px)}
.zone.bar{background:rgba(90,168,255,.2);border:1.5px solid rgba(90,168,255,.55);color:#bcd8ff}
.zone.stage{background:rgba(246,180,76,.18);border:1.5px solid rgba(246,180,76,.5);color:#f6cf8c}
.tbl{position:absolute;border-radius:8px;background:rgba(53,214,160,.32);border:2px solid var(--green);
  display:grid;place-items:center;font-size:12px;font-weight:800;color:#eafff6;cursor:pointer;
  transform-style:preserve-3d;transform:translateZ(12px);transition:.2s var(--ease);
  box-shadow:0 0 16px rgba(53,214,160,.45),0 10px 14px rgba(0,0,0,.55)}
.tbl.sold{background:rgba(251,91,120,.28);border-color:var(--red);color:#ffd7de;
  box-shadow:0 0 14px rgba(251,91,120,.4),0 8px 12px rgba(0,0,0,.5);transform:translateZ(4px);cursor:not-allowed}
.tbl.sel{background:var(--grad);border-color:#fff;color:#fff;box-shadow:0 0 30px rgba(168,85,247,.95),0 14px 20px rgba(0,0,0,.6);
  transform:translateZ(38px) scale(1.14)}
.tbl .h{position:absolute;top:100%;left:0;right:0;height:12px;background:linear-gradient(rgba(53,214,160,.4),transparent);border-radius:0 0 6px 6px}
.tbl.sold .h{background:linear-gradient(rgba(251,91,120,.35),transparent)}
.floorlegend{position:absolute;top:12px;left:12px;z-index:5;display:flex;gap:12px;font-size:11px}
.floorlegend span{display:flex;align-items:center;gap:5px;color:var(--muted);background:rgba(10,10,14,.6);
  backdrop-filter:blur(8px);padding:5px 9px;border-radius:999px}
.floorlegend i{width:9px;height:9px;border-radius:3px}
.floorhint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;font-size:11px;
  color:var(--muted);background:rgba(10,10,14,.6);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;
  display:flex;align-items:center;gap:6px}

/* group payment */
.progwrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:15px}
.progtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.progtop .paid{font-size:24px;font-weight:700;font-family:var(--serif)}
.progtop .paid s{color:var(--muted);font-size:12px;font-family:var(--sans);text-decoration:none;display:block;font-weight:400}
.progtop .tgt{text-align:right;color:var(--muted);font-size:13px}.progtop .tgt b{color:var(--text);font-size:18px;font-family:var(--serif)}
.progbar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.progbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--amber),var(--magenta));
  width:0;transition:width 1s var(--ease)}
.parts{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 4px}
.partchip{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px 4px 4px;font-size:12.5px}
.partchip .av{width:22px;height:22px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:9px;font-weight:700}
.partchip b{font-weight:600}.partchip s{color:var(--green);text-decoration:none;font-size:11px;margin-left:2px}
.paystates{display:flex;gap:8px;overflow-x:auto;margin:14px 0}
.paystate{flex:none;font-size:11px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.paystate.on{background:var(--grad-soft);border-color:var(--violet);color:var(--text)}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:6px}
.msg{display:flex;gap:9px;margin-bottom:11px}
.msg .av{width:28px;height:28px;border-radius:50%;background:var(--grad);flex:none;display:grid;place-items:center;font-size:10px;font-weight:700}
.msg .bub{background:var(--surface2);border-radius:12px;padding:8px 11px;font-size:13px;max-width:78%}
.msg .bub .who{font-size:11px;color:var(--violet-2);font-weight:600;margin-bottom:2px}
.msg.me{flex-direction:row-reverse}.msg.me .bub{background:var(--grad-soft)}
.chatin{display:flex;gap:8px;margin-top:6px}
.chatin input{flex:1;height:42px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:0 13px;color:var(--text);outline:none;font-size:13.5px}
.chatin button{width:42px;height:42px;border-radius:11px;background:var(--grad);display:grid;place-items:center}

/* option cards */
.optcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:15px;margin-bottom:11px;
  display:flex;gap:13px;align-items:flex-start;transition:.2s var(--ease)}
.optcard.on{border-color:var(--violet);background:var(--grad-soft)}
.optcard .oic{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none}
.optcard .oic svg{width:20px;height:20px;color:var(--violet-2)}
.optcard h4{font-size:15px;font-weight:600}.optcard p{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}

/* ---------- SCANNER ---------- */
.scanwrap{position:absolute;inset:0;background:#000;display:flex;flex-direction:column}
.scanview{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(60% 50% at 50% 45%,#141020,#000)}
.scanframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:240px;height:240px;
  border-radius:24px}
.scanframe span{position:absolute;width:34px;height:34px;border:3px solid var(--violet)}
.scanframe span:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.scanframe span:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.scanframe span:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.scanframe span:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.scanline{position:absolute;left:8px;right:8px;height:2px;background:linear-gradient(90deg,transparent,var(--violet),transparent);
  top:8px;animation:scanmove 2.4s var(--ease) infinite;box-shadow:0 0 12px var(--violet)}
@keyframes scanmove{0%,100%{top:8px}50%{top:230px}}
.scanhead{padding:18px;text-align:center}.scanhead h3{font-size:16px;font-weight:600}.scanhead p{font-size:12.5px;color:var(--muted);margin-top:4px}
.scandemo{padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:#0a0a0e;border-top:1px solid var(--line)}
.scandemo .lab{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin-bottom:9px}
.scandemo .btns{display:flex;gap:8px;flex-wrap:wrap}
.scandemo .btns button{flex:1;min-width:calc(50% - 4px);height:42px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500}
.scanresult{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;animation:flashIn .35s var(--ease)}
@keyframes flashIn{from{opacity:0;transform:scale(1.1)}}
.scanresult.valid{background:radial-gradient(circle at center,rgba(53,214,160,.28),rgba(0,0,0,.95))}
.scanresult.invalid{background:radial-gradient(circle at center,rgba(251,91,120,.3),rgba(0,0,0,.95))}
.scanresult.refunded{background:radial-gradient(circle at center,rgba(246,180,76,.26),rgba(0,0,0,.95))}
.scanresult .big{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;margin-bottom:20px;animation:pop .5s var(--ease)}
.scanresult.valid .big{background:var(--green)}.scanresult.invalid .big{background:var(--red)}.scanresult.refunded .big{background:var(--amber)}
.scanresult .big svg{width:56px;height:56px;color:#000}
.scanresult h2{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:1px}
.scanresult .rmeta{margin-top:16px;background:rgba(255,255,255,.08);border:1px solid var(--line2);border-radius:16px;padding:16px 20px;min-width:220px}
.scanresult .rmeta .rr{display:flex;justify-content:space-between;gap:18px;padding:6px 0;font-size:14px}
.scanresult .rmeta .rr b{font-weight:600}
.scanresult .drinkbig{margin-top:14px;font-size:15px;font-weight:600}
.scanresult .drinkbig b{color:var(--amber);font-size:19px}
.scanresult button{margin-top:26px;height:48px;padding:0 30px;border-radius:14px;background:#fff;color:#000;font-weight:700;font-size:15px}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:50;height:78px;
  background:var(--tabbar-grad);
  backdrop-filter:blur(20px);border-top:1px solid var(--line);
  display:flex;padding:8px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted2);transition:.25s var(--ease);position:relative}
.tab svg{width:23px;height:23px}
.tab span{font-size:10px;font-weight:500}
.tab.on{color:var(--text)}
.tab.on svg{color:var(--violet-2);filter:drop-shadow(0 0 8px rgba(168,85,247,.6))}
.tab.on::before{content:"";position:absolute;top:-8px;width:22px;height:3px;border-radius:3px;background:var(--grad)}

/* tab panels */
.panel{position:absolute;inset:0 0 78px 0;overflow-y:auto;z-index:20;background:var(--bg);
  padding-top:0;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.panel.on{opacity:1;pointer-events:auto}
.panel-head{padding:56px 18px 6px}
.panel-head .k{font-size:12px;letter-spacing:2px;color:var(--violet-2);font-weight:600;text-transform:uppercase}
.panel-head h1{font-family:var(--serif);font-size:34px;font-weight:600;margin-top:6px;line-height:1.05}
.panel-body{padding:8px 18px 24px}

/* discover */
.feature{position:relative;height:400px;border-radius:22px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line2)}
.feature .img{position:absolute;inset:0;background:var(--evibe)}
.feature .fade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(8,8,11,.9))}
.feature .k{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  border:1px solid var(--line2);border-radius:999px;padding:6px 13px;font-size:11px;font-weight:600;letter-spacing:1px}
.feature .info{position:absolute;bottom:0;left:0;right:0;padding:20px}
.feature .info h3{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.05}
.feature .info .sub{color:var(--muted);font-size:13.5px;margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:0 18px 6px}
.vcard{flex:none;width:170px}
.vcard .img{height:200px;border-radius:16px;background:var(--evibe);position:relative;overflow:hidden;border:1px solid var(--line)}
.vcard .img .st{position:absolute;top:8px;left:8px;font-size:10px;font-weight:600;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:4px 8px;border-radius:999px;display:flex;align-items:center;gap:5px}
.vcard h4{font-family:var(--serif);font-size:16px;font-weight:600;margin-top:9px}
.vcard p{font-size:12px;color:var(--muted);margin-top:2px}
.trend{display:flex;gap:13px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.trend .rk{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--muted2);width:26px;flex:none}
.trend .img{width:54px;height:54px;border-radius:12px;background:var(--vibe);flex:none}
.trend .ti{flex:1}.trend .ti h4{font-size:15px;font-weight:600}.trend .ti p{font-size:12px;color:var(--muted);margin-top:3px}

/* bookings */
.segbar{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:4px;margin:6px 0 18px}
.segbar button{flex:1;height:38px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.2s}
.segbar button.on{background:var(--grad);color:#fff}
.bkcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.bkcard .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
.bkcard.table .stripe{background:linear-gradient(var(--amber),var(--magenta))}
.bkcard .bh{display:flex;justify-content:space-between;gap:10px}
.bkcard h4{font-family:var(--serif);font-size:18px;font-weight:600}
.bkcard .type{font-size:11px;letter-spacing:1px;color:var(--violet-2);font-weight:600;text-transform:uppercase}
.bkcard .when{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.bkcard .bkstatus{font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;flex:none;height:fit-content}
.bkcard .bkstatus.ok{background:rgba(53,214,160,.15);color:var(--green)}
.bkcard .bkstatus.pend{background:rgba(246,180,76,.15);color:var(--amber)}
.bkcard .bkstatus.past{background:var(--surface2);color:var(--muted)}
.bkcard .bkact{display:flex;gap:8px;margin-top:13px}
.bkcard .bkact button{flex:1;height:40px;border-radius:11px;font-size:13px;font-weight:600;background:var(--surface2);border:1px solid var(--line2)}
.bkcard .bkact button.pri{background:var(--grad);border:none}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .eic{width:64px;height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 16px}

/* profile / roles */
.prof-hero{padding:56px 18px 10px;display:flex;align-items:center;gap:15px}
.prof-hero .pav{width:66px;height:66px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:26px;font-weight:700;font-family:var(--serif)}
.prof-hero h1{font-family:var(--serif);font-size:24px;font-weight:600}
.prof-hero p{color:var(--muted);font-size:13px;margin-top:3px}
.rolecard{background:var(--grad-soft);border:1px solid var(--line2);border-radius:18px;padding:16px;margin:8px 0 18px}
.rolecard .rt{font-size:12px;color:var(--muted);margin-bottom:11px;display:flex;align-items:center;gap:7px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rolebtn{padding:13px;border-radius:13px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:.2s}
.rolebtn.on{border-color:var(--violet);background:var(--grad-soft)}
.rolebtn .e{font-size:20px}.rolebtn h5{font-size:13.5px;font-weight:600;margin-top:7px}.rolebtn p{font-size:11px;color:var(--muted);margin-top:2px}
.listrow{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}
.listrow .li{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;flex:none}
.listrow .li svg{width:18px;height:18px;color:var(--muted)}
.listrow .lt{flex:1}.listrow .lt h4{font-size:14.5px;font-weight:500}
.listrow .chev{color:var(--muted2)}

/* dashboards */
.dash{padding:56px 16px 30px}
.dash-h{font-family:var(--serif);font-size:28px;font-weight:600;margin-bottom:4px}
.dash-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px}
.kpi .kl{font-size:11.5px;color:var(--muted)}
.kpi .kv{font-size:24px;font-weight:700;font-family:var(--serif);margin-top:6px}
.kpi .kd{font-size:11px;margin-top:5px;font-weight:600}.kpi .kd.up{color:var(--green)}.kpi .kd.down{color:var(--red)}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px}
.dcard .dch{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.dcard .dch h4{font-size:15px;font-weight:600}
.approw{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.approw:last-child{border:0}
.approw .ai{width:40px;height:40px;border-radius:11px;background:var(--evibe);flex:none}
.approw .at{flex:1;min-width:0}.approw .at h5{font-size:14px;font-weight:600}.approw .at p{font-size:11.5px;color:var(--muted);margin-top:2px}
.pill{font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:999px}
.pill.pend{background:rgba(246,180,76,.15);color:var(--amber)}
.pill.ok{background:rgba(53,214,160,.15);color:var(--green)}
.pill.rej{background:rgba(251,91,120,.15);color:var(--red)}
.miniact{display:flex;gap:7px;margin-top:9px}
.miniact button{flex:1;height:36px;border-radius:10px;font-size:12.5px;font-weight:600}
.miniact .app{background:var(--grad);color:#fff}.miniact .rej{background:var(--surface2);border:1px solid var(--line2);color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:7px;height:110px;padding-top:10px}
.bars .b{flex:1;background:var(--grad);border-radius:6px 6px 0 0;position:relative;min-height:6px;opacity:.85}
.bars .b span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted2)}

.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:11px 16px;font-size:13px;
  box-shadow:var(--shadow);opacity:0;transition:.3s var(--ease);display:flex;align-items:center;gap:9px;pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:var(--green);flex:none}
.rolebtn .entertag{display:flex;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--violet-2);margin-top:8px}
.rolebtn .entertag svg{width:13px;height:13px}

/* ================= PRO WORKSPACES ================= */
.promode{position:absolute;inset:0;z-index:56;background:var(--bg);display:none;flex-direction:column}
.promode.show{display:flex}
.pro-head{padding:calc(14px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface),var(--bg));display:flex;align-items:center;gap:12px;flex:none}
.pro-head .badge{width:44px;height:44px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-size:22px;flex:none;box-shadow:0 8px 20px -8px rgba(168,85,247,.7)}
.pro-head .pt{flex:1;min-width:0}

/* ---- markers ---- */
function filtersPass(v){
 if(v.published===false)return false;   // God mode can unpublish a venue
 if(v.city!==S.dest)return false;       // only the active destination's venues
 for(const f of S.filters){
   if(f==='open'&&v.status!=='open')return false;
   if(f==='tables'&&(v.tablesText||'').includes('No tables'))return false;
   if(f==='newly'&&!v.newly)return false;
   if(['Techno','House','EDM','Latin','Rooftop','Speakeasy'].includes(f)){
     const hay=[...v.genres,...v.tags,v.type].join(' ');
     if(!hay.toLowerCase().includes(f.toLowerCase()))return false;
   }
 }
 const a=S.adv;
 if(a){
   if(a.hoods.size&&!a.hoods.has(v.hood))return false;
   if(a.types.size&&!a.types.has(v.type))return false;
   if(a.prices.size&&!a.prices.has(v.price))return false;
   if(a.genres.size&&![...a.genres].some(g=>v.genres.includes(g)))return false;
   if(a.dist){const km=parseFloat(v.dist)||99;if(km>a.dist)return false;}
 }
 return true;
}
function matchVenue(v,q){
 if(!q)return true;
 const hay=[v.name,v.hood,v.type,v.atmosphere,...v.genres,...v.tags,...v.events.flatMap(e=>[e.title,e.art])].join(' ').toLowerCase();
 return hay.includes(q);
}

function haversine(a,b,c,d){const R=6371,dLat=(c-a)*Math.PI/180,dLng=(d-b)*Math.PI/180,la1=a*Math.PI/180,la2=c*Math.PI/180;
 const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function useMyLocation(){
 if(!navigator.geolocation){toast('Location not available on this device');return;}
 toast('Requesting your location…');
 navigator.geolocation.getCurrentPosition(pos=>{
   const {latitude,longitude}=pos.coords;
   const on=DESTINATIONS.filter(d=>d.published!==false);
   let best=null,bd=1e9;on.forEach(d=>{const dist=haversine(latitude,longitude,d.lat,d.lng);if(dist<bd){bd=dist;best=d;}});
   if(!best||bd>400){toast('No supported destination nearby — pick one below');return;}
   confirmSheet('Use '+best.name+'?','That\'s the closest supported destination to you (~'+Math.round(bd)+' km). Use it as your location?','Use '+best.name,()=>applyDestination(best.slug));
 },err=>{toast('Location permission denied — pick a city below');},{timeout:8000});
}

 const w=$('#floorwrap');let drag=false,px,py,pinch=0;
 w.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;w.setPointerCapture(e.pointerId);};
 w.onpointermove=e=>{if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;

function venueScore(v,q){
 let s=0;const n=v.name.toLowerCase();
 if(n===q)s+=100; else if(n.startsWith(q))s+=60; else if(n.includes(q))s+=40;
 if(v.hood.toLowerCase().includes(q))s+=20;
 if([...v.genres,...v.tags,v.type].join(' ').toLowerCase().includes(q))s+=15;
 if(v.events.some(e=>(e.title+' '+e.art).toLowerCase().includes(q)))s+=12;
 if(v.status==='open')s+=3;
 return s;
}
function searchResults(){

 let list=VENUES.filter(v=>filtersPass(v)&&matchVenue(v,q));
 if(q) list.sort((a,b)=>venueScore(b,q)-venueScore(a,q));
 else  list.sort((a,b)=>((b.status==='open')-(a.status==='open'))||((b.newly?1:0)-(a.newly?1:0))||(parseFloat(a.dist)-parseFloat(b.dist)));
 return list;
}

function openScanner(){
 const ov=$('#overlay');
 ov.innerHTML=`<div class="scanwrap">
   <div class="scanhead"><h3>Ticket Scanner</h3><p>Point at a guest’s QR code</p></div>
   <div class="scanview" id="scanview">
     <div class="scanframe"><span></span><span></span><span></span><span></span></div>
     <div class="scanline"></div>
   </div>
   <div class="scandemo"><div class="lab">Demo · simulate a scan</div><div class="btns" id="scanbtns"></div>
     <button class="btn ghost wide" style="margin-top:9px" id="scan-close">Close scanner</button></div>
 </div>`;
 ov.classList.add('show');
 const btns=$('#scanbtns');
 const valid=S.tickets.filter(t=>!t.used&&!t.refunded);
 btns.innerHTML='';
 if(valid.length){valid.slice(0,2).forEach(t=>{const b=el(`<button>✓ ${t.ev.title.slice(0,16)}…</button>`);b.onclick=()=>scanResult('valid',t);btns.appendChild(b);});}
 const dup=el(`<button>⟳ Already-used ticket</button>`);dup.onclick=()=>scanResult('used',valid[0]);btns.appendChild(dup);
 const inv=el(`<button>✕ Fake / invalid QR</button>`);inv.onclick=()=>scanResult('invalid');btns.appendChild(inv);
 const ref=el(`<button>€ Refunded ticket</button>`);ref.onclick=()=>scanResult('refunded');btns.appendChild(ref);
 if(!valid.length){const note=el(`<p style="font-size:12px;color:var(--muted2);width:100%;margin-top:4px">Buy a ticket as a guest first to scan a real one.</p>`);btns.appendChild(note);}
 $('#scan-close').onclick=()=>ov.classList.remove('show');
}
function scanResult(kind,tk){
 const sv=$('#scanview');
 let cls,icon,title,meta='',drinks='';
 if(kind==='valid'){tk.used=true;cls='valid';icon=IC.check;title='VALID';
   meta=`<div class="rr"><span>Ticket</span><b>${tk.tier}</b></div><div class="rr"><span>Event</span><b>${tk.ev.title.slice(0,22)}</b></div>`;
   drinks=tk.drinks?`<div class="drinkbig">Give guest <b>${tk.drinks}</b> drink voucher${tk.drinks>1?'s':''} 🍸</div>`:`<div class="drinkbig" style="color:var(--muted)">No drink vouchers</div>`;
   beep(880);}
 else if(kind==='used'){cls='invalid';icon=IC.x;title='ALREADY USED';meta=`<div class="rr"><span>Status</span><b>Entry already scanned</b></div>`;beep(200);}
 else if(kind==='refunded'){cls='refunded';icon=IC.euro;title='REFUNDED';meta=`<div class="rr"><span>Status</span><b>Ticket was refunded</b></div>`;beep(300);}
 else{cls='invalid';icon=IC.x;title='INVALID';meta=`<div class="rr"><span>Status</span><b>Not a valid ticket</b></div>`;beep(200);}
 const r=el(`<div class="scanresult ${cls}"><div class="big">${icon}</div><h2>${title}</h2>
   <div class="rmeta">${meta}</div>${drinks}<button id="scan-again">Scan next</button></div>`);
 sv.appendChild(r);
 if(navigator.vibrate)navigator.vibrate(kind==='valid'?60:[40,40,40]);
 $('#scan-again').onclick=()=>{r.remove();};
}
function beep(f){try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.start();o.stop(a.currentTime+.25);}catch(e){}}

/* ======================= MAP PAN / ZOOM ======================= */
let view={x:0,y:0,s:1};
function applyView(){$('#world').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;}
function resetMapView(){view={x:0,y:0,s:1};applyView();}
function initMapPanZoom(){
 const ms=$('#mapscreen');let drag=false,px,py,moved=false;
 ms.addEventListener('pointerdown',e=>{if(e.target.closest('.marker')||e.target.closest('.topbar')||e.target.closest('.sheet'))return;drag=true;moved=false;px=e.clientX;py=e.clientY;});
 ms.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;view.x+=dx;view.y+=dy;px=e.clientX;py=e.clientY;applyView();});
 ms.addEventListener('pointerup',()=>drag=false);
 ms.addEventListener('wheel',e=>{e.preventDefault();const ns=Math.max(.75,Math.min(2.4,view.s-e.deltaY*0.0015));view.s=ns;applyView();},{passive:false});
}

/* ======================= stylised Milan SVG ======================= */
function milanSVG(mini,focus){
 const par=mini?'xMidYMid meet':'none';
 const nils=MILAN_DISTRICTS.map(d=>`<path d="${d.d}" class="nil"/>`).join('');
 let dot='';
 if(mini&&focus&&VENUE_POS[focus.id]){
   const fx=VENUE_POS[focus.id].x/100*MILAN_W, fy=VENUE_POS[focus.id].y/100*MILAN_H;
   dot=`<circle cx="${fx}" cy="${fy}" r="14" fill="#A855F7"/><circle cx="${fx}" cy="${fy}" r="26" fill="none" stroke="#A855F7" stroke-width="3" stroke-opacity="0.5"/>`;
 }
 return `<svg ${mini?'':'id="mapsvg"'} viewBox="0 0 ${MILAN_W} ${MILAN_H}" preserveAspectRatio="${par}" style="width:100%;height:100%;display:block">
   <defs>
     <radialGradient id="mg" cx="52%" cy="44%" r="80%"><stop offset="0%" stop-color="#161226"/><stop offset="55%" stop-color="#0b0a13"/><stop offset="100%" stop-color="#08070c"/></radialGradient>
   </defs>
   <rect class="mbg" x="-200" y="-200" width="${MILAN_W+400}" height="${MILAN_H+400}" fill="url(#mg)"/>
   <g class="nils">${nils}</g>
   <path d="${MILAN_BOUNDARY}" class="cityline"/>
   ${dot}
 </svg>`;
}
function venueCentroid(){
 const ks=Object.keys(VENUE_POS||{});if(!ks.length)return{x:52,y:46};
 let x=0,y=0;ks.forEach(k=>{x+=VENUE_POS[k].x;y+=VENUE_POS[k].y;});
 return{x:x/ks.length,y:y/ks.length};
}
function sizeWorld(){
 const ms=$('#mapscreen');if(!ms||!ms.clientWidth)return;
 const cw=ms.clientWidth,ch=ms.clientHeight,aspect=MILAN_W/MILAN_H;
 let w,h;
 if(cw/ch>aspect){w=cw;h=cw/aspect;}else{h=ch;w=ch*aspect;}
 const boost=1.7;w*=boost;h*=boost;   // zoom into central Milan
 const c=venueCentroid();
 const world=$('#world');
 world.style.width=w+'px';world.style.height=h+'px';
 // place the venue cluster centroid at the visual centre (slightly above middle for the sheet)
 world.style.left=(cw/2 - c.x/100*w)+'px';
 world.style.top=(ch*0.42 - c.y/100*h)+'px';
}

/* create event / proposal */
function openCreateEvent(asProposal){
 const ov=$('#overlay2');
 const venueOpts=VENUES.map(v=>`<option value="${v.id}" ${v.id===S.proVenue?'selected':''}>${v.name}</option>`).join('');
 ov.innerHTML=`<div class="ovback"><button class="roundbtn" id="ce-back">${IC.back}</button><div class="ovtitle">${asProposal?'New proposal':'Create event'}</div></div>
   <div class="flowbody">
     <div class="step-h">${asProposal?'Propose an event':'Create an event'}</div>
     <div class="step-sub">${asProposal?'Submitted to the venue for approval, then to guests.':'Publishes straight to your venue.'}</div>
     <div class="field"><label>Event title</label><input id="ce-title" placeholder="Warehouse: …"></div>
     ${asProposal?`<div class="field"><label>Venue</label><select id="ce-venue">${venueOpts}</select></div>`:''}
     <div class="field"><label>Artists / line-up</label><input id="ce-art" placeholder="Headliner · support"></div>
     <div class="field row2"><div><label>Day</label><input id="ce-day" placeholder="21"></div><div><label>Month</label><input id="ce-mon" placeholder="SEP"></div></div>
     <div class="field"><label>Time</label><input id="ce-time" placeholder="23:00–05:00"></div>
     <div class="field"><label>Genre</label><select id="ce-genre">${['Techno','House','EDM','Latin','Rooftop','Speakeasy'].map(g=>`<option>${g}</option>`).join('')}</select></div>
     <div class="field row2"><div><label>Ticket name</label><input id="ce-tn" value="General"></div><div><label>Price €</label><input id="ce-tp" type="number" value="20"></div></div>
     <div class="field"><label>Quantity</label><input id="ce-tq" type="number" value="300"></div>
   </div>
   <div class="footer-cta"><button class="btn pri wide" id="ce-submit">${asProposal?'Submit for approval':'Publish event'}</button></div>`;
 ov.classList.add('show');ov.scrollTop=0;
 $('#ce-back').onclick=()=>ov.classList.remove('show');
 const gmap={Techno:'techno',House:'house',EDM:'edm',Latin:'latin',Rooftop:'rooftop',Speakeasy:'speak'};
 $('#ce-submit').onclick=()=>{
   const title=$('#ce-title').value.trim();if(!title){toast('Give the event a title');return;}
   const genre=$('#ce-genre').value,vibe=gmap[genre]||'house';
   const day=$('#ce-day').value||'21',mon=($('#ce-mon').value||'SEP').toUpperCase(),time=$('#ce-time').value||'23:00–05:00';
   const tier={n:$('#ce-tn').value||'General',p:+$('#ce-tp').value||20,q:+$('#ce-tq').value||300};
   if(asProposal){
     const venueId=$('#ce-venue').value;
     PROPOSALS.push({id:'pr'+Date.now(),title,org:ORG_ME,venueId,day,mon,time,genres:[genre],tier,state:'pending_venue',vibe});
     toast('Proposal submitted to '+VENUE(venueId).name);
   }else{
     const v=VENUE(S.proVenue);
     v.events.unshift({id:'ev'+Date.now(),title,art:$('#ce-art').value||'Line-up TBA',day,mon,time,vibe,genres:[genre],
       desc:title+' at '+v.name+'.',tiers:[{n:tier.n,p:tier.p,left:tier.q,d:'Standard entry'}]});
     toast('Event published — live in the guest app');
   }
   ov.classList.remove('show');renderProBody();
 };
}

if(!S.recentDests.includes(S.dest))S.recentDests.unshift(S.dest);
sizeWorld(); renderChips(); renderMarkers(); initMapPanZoom(); refreshDestControls(); setTab('map');
window.addEventListener('resize',()=>sizeWorld());
</script>
