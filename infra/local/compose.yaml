name: clubby-platform-local
services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: clubby
      POSTGRES_USER: clubby
      POSTGRES_PASSWORD: clubby_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubby -d clubby"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
